name: Profile Health & Metrics Verification

on:
  schedule:
    # Runs at 12:00 UTC every Monday
    - cron: '0 12 * * 1'
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  verify-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Profile Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate README Markdown & Link Integrity
        run: |
          python -c "
          with open('README.md', 'r') as f:
              content = f.read()
          assert 'Krish Bharadiya' in content, 'Missing author name'
          assert 'Flagship Projects' in content, 'Missing projects section'
          assert 'SignBridge' in content, 'Missing SignBridge link'
          assert 'st-pc-uq-gkan' in content, 'Missing st-pc-uq-gkan link'
          print('✓ README structure verified successfully.')
          "
